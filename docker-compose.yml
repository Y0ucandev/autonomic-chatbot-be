services:
  app:
    build: .
    container_name: chatbot_app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
    restart: always
    env_file:
      - .env.dev

  db:
    image: postgres:latest
    container_name: chatbot_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d chatbot_db -U db_admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    env_file:
      - .env.dev
